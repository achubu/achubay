<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyee Landed Cost Calculator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- SheetJS Library for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Top Navigation Header -->
  <header class="bg-slate-800/80 border-b border-slate-700/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600 rounded-lg text-white">
          <i data-lucide="calculator" class="w-5 h-5"></i>
        </div>
        <h1 class="text-lg font-bold text-slate-100">Achubay <span class="text-xs font-normal text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded-full border border-indigo-800/50">Landed Cost</span></h1>
      </div>

      <!-- Project Selection Controls -->
      <div class="flex items-center gap-2">
        <select id="projectSelect" onchange="switchProject(this.value)" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500">
        </select>
        
        <button onclick="createNewProjectPrompt()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-1.5 rounded-lg text-xs transition" title="New Project">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
        
        <button onclick="deleteCurrentProject()" class="bg-slate-700 hover:bg-rose-900/60 text-slate-200 hover:text-rose-300 p-1.5 rounded-lg text-xs transition" title="Delete Project">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>

        <div class="h-4 w-px bg-slate-700 mx-1"></div>

        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
          <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
          Export Excel
        </button>

        <button onclick="exportBackupJSON()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-1.5 rounded-lg text-xs transition" title="Backup Data (JSON)">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>

        <label class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-1.5 rounded-lg text-xs transition cursor-pointer" title="Restore Data (JSON)">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <input type="file" accept=".json" onchange="importBackupJSON(event)" class="hidden">
        </label>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full flex flex-col gap-6">

    <!-- Top Upload & Config Section -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- PDF Upload Box -->
      <div id="dropZone" class="lg:col-span-1 border-2 border-dashed border-slate-700 hover:border-indigo-500 bg-slate-800/40 rounded-xl p-6 flex flex-col items-center justify-center text-center transition cursor-pointer relative group">
        <input type="file" id="pdfFileInput" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
        
        <div class="p-3 bg-slate-800 rounded-full border border-slate-700 group-hover:border-indigo-500 text-indigo-400 mb-3 transition">
          <i data-lucide="file-up" class="w-6 h-6"></i>
        </div>
        <h3 class="text-sm font-semibold text-slate-200">Import Buyee Orders PDF</h3>
        <p class="text-xs text-slate-400 mt-1">Click to select file or drag & drop here</p>
      </div>

      <!-- Global Controls Panel -->
      <div class="lg:col-span-2 bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col justify-between">
        <div>
          <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Global Cost Allocation Settings</h2>
          
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Global Tariff Rate (%)</label>
              <input type="number" id="globalTariffInput" step="0.1" value="10.0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-rose-300 font-mono font-bold focus:outline-none focus:border-indigo-500">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">International Ship ($)</label>
              <input type="number" id="globalShippingInput" step="0.01" value="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-indigo-500">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Service/Consol Fees ($)</label>
              <input type="number" id="globalFeesInput" step="0.01" value="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-indigo-500">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Cost Allocation Mode</label>
              <select id="allocationStrategy" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                <option value="proportional">Proportional (Value %)</option>
                <option value="equal">Equal Split Per Item</option>
              </select>
            </div>
