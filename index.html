<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyee Landed Cost Calculator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- SheetJS Library for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Top Navigation Header -->
  <header class="bg-slate-800/80 border-b border-slate-700/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600 rounded-lg text-white">
          <i data-lucide="calculator" class="w-5 h-5"></i>
        </div>
        <h1 class="text-lg font-bold text-slate-100">Achubay <span class="text-xs font-normal text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded-full border border-indigo-800/50">Landed Cost</span></h1>
      </div>

      <!-- Project Selection Controls -->
      <div class="flex items-center gap-2">
        <select id="projectSelect" onchange="switchProject(this.value)" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500">
        </select>
        
        <button onclick="createNewProjectPrompt()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-1.5 rounded-lg text-xs transition" title="New Project">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
        
        <button onclick="deleteCurrentProject()" class="bg-slate-700 hover:bg-rose-900/60 text-slate-200 hover:text-rose-300 p-1.5 rounded-lg text-xs transition" title="Delete Project">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>

        <div class="h-4 w-px bg-slate-700 mx-1"></div>

        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
          <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
          Export Excel
        </button>

        <button onclick="exportBackupJSON()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-1.5 rounded-lg text-xs transition" title="Backup Data (JSON)">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>

        <label class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-1.5 rounded-lg text-xs transition cursor-pointer" title="Restore Data (JSON)">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <input type="file" accept=".json" onchange="importBackupJSON(event)" class="hidden">
        </label>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full flex flex-col gap-6">

    <!-- Top Upload & Config Section -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Separate PDF Import Panel -->
      <div class="lg:col-span-1 bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col justify-between">
        <div>
          <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">PDF Ingestion</h2>
          
          <div class="space-y-3">
            <!-- Order List Upload Button -->
            <label class="flex items-center justify-between p-3 bg-slate-900/80 hover:bg-slate-800 border border-slate-700 hover:border-indigo-500 rounded-lg cursor-pointer transition group">
              <div class="flex items-center gap-2.5">
                <div class="p-1.5 bg-indigo-950 text-indigo-400 rounded-md border border-indigo-800/50 group-hover:bg-indigo-600 group-hover:text-white transition">
                  <i data-lucide="file-plus" class="w-4 h-4"></i>
                </div>
                <div class="text-left">
                  <div class="text-xs font-semibold text-slate-200">Import Order Receipts</div>
                  <div class="text-[10px] text-slate-400">Buyee Order PDF lists</div>
                </div>
              </div>
              <input type="file" accept=".pdf" onchange="handleOrderFileSelect(event)" class="hidden">
            </label>

            <!-- Shipping Manifest Upload Button -->
            <label class="flex items-center justify-between p-3 bg-slate-900/80 hover:bg-slate-800 border border-slate-70
